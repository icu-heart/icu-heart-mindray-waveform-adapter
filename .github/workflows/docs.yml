name: deploy mkdocs

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      # Need to have mkdocs v1 as v2 is a breaking change
      - run: pip install "mkdocs<2.0" mkdocs-material
      - run: mkdocs gh-deploy --force
